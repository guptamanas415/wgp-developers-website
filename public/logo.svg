<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="200" height="200" fill="#05070B" rx="30" />
  <!-- Outer Hexagon -->
  <polygon points="100,20 170,60 170,140 100,180 30,140 30,60" fill="#0B0F19" stroke="url(#neonGlow)" stroke-width="6" filter="url(#glow)" />
  <!-- Inner Circuit Hexagon -->
  <polygon points="100,38 152,68 152,132 100,162 48,132 48,68" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="4,4" />
  <!-- Monogram WGP -->
  <path d="M52 74 L68 130 L84 94 L100 130 L116 94 L132 130 L148 74" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="100" cy="100" r="6" fill="#00E5FF" />
</svg>
